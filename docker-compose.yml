services:
  db:
    image: pgvector/pgvector:pg16
    container_name: traceid-db
    environment:
      POSTGRES_USER: traceid
      POSTGRES_PASSWORD: traceid
      POSTGRES_DB: traceid
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceid"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
